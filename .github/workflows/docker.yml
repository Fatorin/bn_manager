name: Docker

# Builds the image and pushes it to Docker Hub as fatorin/bn_manager.
# Runs on version tags (0.3.10 or v0.3.10); the tag must match Cargo.toml.
#
# Credentials live in the "dockerhub" environment (DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN), whose deployment rules only admit version tags, so no other
# branch or workflow can read the token.
on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

env:
  IMAGE: fatorin/bn_manager

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      # Third-party actions are pinned by commit SHA; the comment is the release it points to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
